name: Sync results from HLTV
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save hltv
      - run: node scripts/sync.mjs data/events/pgl-singapore-2026.json
        continue-on-error: true
      - name: Commit changes
        run: |
          git config user.name "results-bot"; git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || (git commit -m "Update results" && git push))
